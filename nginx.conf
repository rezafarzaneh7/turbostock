server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html;

    client_max_body_size 10M;

    # SEO-friendly URL rewrites
    location ~ ^/product/([0-9]+)/?$ {
        rewrite ^/product/([0-9]+)/?$ /product.php?id=$1 last;
    }

    location ~ ^/store/([0-9]+)/?$ {
        rewrite ^/store/([0-9]+)/?$ /store.php?id=$1 last;
    }

    location ~ ^/category/([a-zA-Z0-9-]+)/?$ {
        rewrite ^/category/([a-zA-Z0-9-]+)/?$ /browse.php?category=$1 last;
    }

    location ~ ^/order/([0-9]+)/?$ {
        rewrite ^/order/([0-9]+)/?$ /orders/view.php?id=$1 last;
    }

    location ~ ^/seller/order/([0-9]+)/?$ {
        rewrite ^/seller/order/([0-9]+)/?$ /seller/orders.php?view=$1 last;
    }

    # Main location - handle other URLs
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP processing
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Protect sensitive directories
    location ~ /\.(ht|git|env) {
        deny all;
    }

    location ~ /(config|includes|lang|vendor)/ {
        deny all;
        return 404;
    }

    # Static assets caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
